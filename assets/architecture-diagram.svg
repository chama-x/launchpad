<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="arch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080c"/>
      <stop offset="50%" stop-color="#0b0e15"/>
      <stop offset="100%" stop-color="#10131d"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-col1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 123, 0, 0.14)"/>
      <stop offset="100%" stop-color="rgba(255, 123, 0, 0.02)"/>
    </linearGradient>
    <linearGradient id="card-col2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(168, 85, 247, 0.14)"/>
      <stop offset="100%" stop-color="rgba(168, 85, 247, 0.02)"/>
    </linearGradient>
    <linearGradient id="card-col3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(59, 130, 246, 0.14)"/>
      <stop offset="100%" stop-color="rgba(59, 130, 246, 0.02)"/>
    </linearGradient>

    <filter id="arch-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.60"/>
    </filter>

    <style>
      .txt-display { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; font-weight: 700; fill: #ffffff; }
      .txt-sub { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; fill: #94a3b8; }
      .txt-mono { font-family: "SF Mono", Menlo, Monaco, monospace; font-size: 11px; fill: #cbd5e1; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1100" height="520" fill="url(#arch-bg)" rx="16"/>

  <!-- Diagram Title -->
  <g transform="translate(60, 44)">
    <text x="0" y="24" class="txt-display" font-size="22" letter-spacing="-0.3">Systems Architecture &amp; Boundary Separation</text>
    <text x="0" y="46" class="txt-sub" font-size="13">Decoupled Physical Storage • Self-Contained Engine • Native macOS Surfaces</text>
  </g>

  <!-- 3 Columns Container -->
  <g transform="translate(60, 105)">
    
    <!-- Column 1: Physical Working Trees -->
    <g transform="translate(0, 0)" filter="url(#arch-shadow)">
      <rect width="300" height="360" rx="14" fill="url(#card-col1)" stroke="#ff7b00" stroke-opacity="0.35" stroke-width="1.2"/>
      
      <circle cx="36" cy="36" r="14" fill="#381b0a" stroke="#ff7b00" stroke-width="1"/>
      <text x="30" y="41" font-size="14">💾</text>
      <text x="62" y="34" class="txt-display" font-size="16">Physical Storage</text>
      <text x="62" y="50" class="txt-sub" font-size="11">~/Projects/ (100% Pristine)</text>

      <line x1="20" y1="68" x2="280" y2="68" stroke="rgba(255,255,255,0.06)"/>

      <g transform="translate(18, 86)">
        <rect width="264" height="40" rx="6" fill="#181a24" stroke="rgba(255,255,255,0.05)"/>
        <circle cx="16" cy="20" r="4.5" fill="#ff7b00"/>
        <text x="30" y="24" class="txt-mono">🟠 HOT Repos (Dependencies)</text>

        <g transform="translate(0, 48)">
          <rect width="264" height="40" rx="6" fill="#181a24" stroke="rgba(255,255,255,0.05)"/>
          <circle cx="16" cy="20" r="4.5" fill="#eab308"/>
          <text x="30" y="24" class="txt-mono">🟡 WARM Repos (Clean git)</text>
        </g>

        <g transform="translate(0, 96)">
          <rect width="264" height="40" rx="6" fill="#181a24" stroke="rgba(255,255,255,0.05)"/>
          <circle cx="16" cy="20" r="4.5" fill="#a855f7"/>
          <text x="30" y="24" class="txt-mono">🟣 Pinned Repos (Protected)</text>
        </g>

        <g transform="translate(0, 144)">
          <rect width="264" height="48" rx="6" fill="#181a24" stroke="rgba(255,255,255,0.05)"/>
          <text x="14" y="20" class="txt-mono" fill="#38bdf8">AGENTS.md Contract</text>
          <text x="14" y="36" class="txt-sub" font-size="10">Symlinked to CLAUDE.md / GEMINI.md</text>
        </g>
      </g>
    </g>

    <!-- Arrow 1 -> 2 -->
    <g transform="translate(308, 175)">
      <line x1="0" y1="0" x2="24" y2="0" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3,3"/>
      <polygon points="24,-4 32,0 24,4" fill="#a855f7"/>
    </g>

    <!-- Column 2: Engine & State -->
    <g transform="translate(340, 0)" filter="url(#arch-shadow)">
      <rect width="300" height="360" rx="14" fill="url(#card-col2)" stroke="#a855f7" stroke-opacity="0.35" stroke-width="1.2"/>
      
      <circle cx="36" cy="36" r="14" fill="#2a143d" stroke="#a855f7" stroke-width="1"/>
      <text x="30" y="41" font-size="14">⚙️</text>
      <text x="62" y="34" class="txt-display" font-size="16">Launchpad Engine</text>
      <text x="62" y="50" class="txt-sub" font-size="11">.launchpad/ (Mode 0700)</text>

      <line x1="20" y1="68" x2="280" y2="68" stroke="rgba(255,255,255,0.06)"/>

      <g transform="translate(18, 86)">
        <rect width="264" height="40" rx="6" fill="#181a24" stroke="rgba(255,255,255,0.05)"/>
        <text x="14" y="24" class="txt-mono">manifest.json (Atomic POSIX)</text>

        <g transform="translate(0, 48)">
          <rect width="264" height="40" rx="6" fill="#181a24" stroke="rgba(255,255,255,0.05)"/>
          <text x="14" y="24" class="txt-mono" fill="#22c55e">SafetyGate (Guardrail 3)</text>
        </g>

        <g transform="translate(0, 96)">
          <rect width="264" height="40" rx="6" fill="#181a24" stroke="rgba(255,255,255,0.05)"/>
          <text x="14" y="24" class="txt-mono">Toolchain &amp; Port Probe</text>
        </g>

        <g transform="translate(0, 144)">
          <rect width="264" height="48" rx="6" fill="#181a24" stroke="rgba(255,255,255,0.05)"/>
          <text x="14" y="20" class="txt-mono" fill="#c084fc">Single-file Python 3 Stdlib</text>
          <text x="14" y="36" class="txt-sub" font-size="10">0 MB RAM · Zero Background Daemons</text>
        </g>
      </g>
    </g>

    <!-- Arrow 2 -> 3 -->
    <g transform="translate(648, 175)">
      <line x1="0" y1="0" x2="24" y2="0" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,3"/>
      <polygon points="24,-4 32,0 24,4" fill="#3b82f6"/>
    </g>

    <!-- Column 3: Native macOS Surfaces -->
    <g transform="translate(680, 0)" filter="url(#arch-shadow)">
      <rect width="300" height="360" rx="14" fill="url(#card-col3)" stroke="#3b82f6" stroke-opacity="0.35" stroke-width="1.2"/>
      
      <circle cx="36" cy="36" r="14" fill="#0f2347" stroke="#3b82f6" stroke-width="1"/>
      <text x="30" y="41" font-size="14">🍎</text>
      <text x="62" y="34" class="txt-display" font-size="16">macOS Surfaces</text>
      <text x="62" y="50" class="txt-sub" font-size="11">Launchpad/ (100% Disposable)</text>

      <line x1="20" y1="68" x2="280" y2="68" stroke="rgba(255,255,255,0.06)"/>

      <g transform="translate(18, 86)">
        <rect width="264" height="40" rx="6" fill="#181a24" stroke="rgba(255,255,255,0.05)"/>
        <text x="14" y="24" class="txt-mono">Spotlight (⌘Space .webloc)</text>

        <g transform="translate(0, 48)">
          <rect width="264" height="40" rx="6" fill="#181a24" stroke="rgba(255,255,255,0.05)"/>
          <text x="14" y="24" class="txt-mono">Finder Tag Attributes (xattr)</text>
        </g>

        <g transform="translate(0, 96)">
          <rect width="264" height="40" rx="6" fill="#181a24" stroke="rgba(255,255,255,0.05)"/>
          <text x="14" y="24" class="txt-mono">Quick Look (Space README.html)</text>
        </g>

        <g transform="translate(0, 144)">
          <rect width="264" height="48" rx="6" fill="#181a24" stroke="rgba(255,255,255,0.05)"/>
          <text x="14" y="20" class="txt-mono" fill="#60a5fa">Finder Quick Actions</text>
          <text x="14" y="36" class="txt-sub" font-size="10">Automator Services in ~/Library</text>
        </g>
      </g>
    </g>
  </g>
</svg>
