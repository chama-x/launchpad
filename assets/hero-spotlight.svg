<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="canvas-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080b"/>
      <stop offset="50%" stop-color="#0c0e14"/>
      <stop offset="100%" stop-color="#10121a"/>
    </linearGradient>

    <!-- Subtle Ambient Glows -->
    <radialGradient id="ambient-blue" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambient-orange" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ff7b00" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ff7b00" stop-opacity="0"/>
    </radialGradient>

    <!-- Sequoia Frosted Glass Shaders -->
    <linearGradient id="spotlight-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 33, 44, 0.94)"/>
      <stop offset="100%" stop-color="rgba(18, 20, 28, 0.98)"/>
    </linearGradient>

    <linearGradient id="search-input-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.06)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <linearGradient id="selected-row" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- macOS Window Drop Shadow -->
    <filter id="spotlight-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="36" flood-color="#000000" flood-opacity="0.80"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.40"/>
    </filter>

    <filter id="badge-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.30"/>
    </filter>

    <style>
      .sf-display { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro", "Helvetica Neue", sans-serif; }
      .sf-text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", "Helvetica Neue", sans-serif; }
      .sf-mono { font-family: "SF Mono", Menlo, Monaco, Consolas, monospace; }
      
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor { animation: blink 1s infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="640" fill="url(#canvas-bg)"/>
  <rect width="1280" height="640" fill="url(#ambient-blue)"/>
  <rect width="1280" height="640" fill="url(#ambient-orange)"/>

  <!-- Subtle Blueprint Mesh -->
  <g opacity="0.025" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="1280" height="640" fill="url(#grid)"/>
  </g>

  <!-- Header Branding (Minimal & Dignified) -->
  <g transform="translate(80, 52)">
    <rect width="32" height="32" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="9" y="22" font-size="16">🚀</text>
    <text x="44" y="22" class="sf-display" font-size="18" font-weight="700" fill="#ffffff" letter-spacing="-0.4">Launchpad</text>
    <text x="145" y="22" class="sf-mono" font-size="13" fill="#64748b">v2.0 · macOS Native</text>

    <!-- Top Right Spec Badges -->
    <g transform="translate(860, 0)">
      <rect x="0" y="2" width="115" height="26" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)"/>
      <text x="57" y="19" class="sf-mono" font-size="11" fill="#94a3b8" text-anchor="middle">0 MB Idle RAM</text>
      
      <rect x="125" y="2" width="125" height="26" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)"/>
      <text x="187" y="19" class="sf-mono" font-size="11" fill="#94a3b8" text-anchor="middle">Zero Daemons</text>
    </g>
  </g>

  <!-- Spotlight Overlay Window -->
  <g transform="translate(180, 110)" filter="url(#spotlight-shadow)">
    <!-- Glass Body -->
    <rect width="920" height="440" rx="20" fill="url(#spotlight-glass)" stroke="rgba(255,255,255,0.14)" stroke-width="1.2"/>

    <!-- Search Input Bar -->
    <g transform="translate(24, 24)">
      <rect width="872" height="64" rx="14" fill="url(#search-input-bg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      
      <!-- Magnifying Glass Icon -->
      <g transform="translate(20, 20)">
        <circle cx="10" cy="10" r="7.5" fill="none" stroke="#94a3b8" stroke-width="2.2"/>
        <line x1="15.5" y1="15.5" x2="22" y2="22" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round"/>
      </g>

      <!-- Search Input Text -->
      <text x="56" y="39" class="sf-display" font-size="22" font-weight="500" fill="#ffffff" letter-spacing="-0.2">openworldeye live</text>
      <rect x="254" y="18" width="2" height="28" fill="#38bdf8" class="cursor"/>

      <!-- Shortcut Hint Badge -->
      <rect x="780" y="17" width="72" height="30" rx="6" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)"/>
      <text x="816" y="37" class="sf-text" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="middle">Return ↵</text>
    </g>

    <!-- Search Results List -->
    <g transform="translate(24, 104)">
      <!-- Selected Top Result -->
      <g transform="translate(0, 0)">
        <rect width="872" height="74" rx="12" fill="url(#selected-row)" filter="url(#badge-shadow)"/>
        
        <!-- App Icon -->
        <rect x="16" y="15" width="44" height="44" rx="10" fill="rgba(255,255,255,0.2)"/>
        <text x="27" y="44" font-size="22">🌐</text>

        <!-- Result Text -->
        <text x="74" y="34" class="sf-display" font-size="17" font-weight="600" fill="#ffffff">OpenWorldEye — Live Deployment</text>
        <text x="74" y="55" class="sf-mono" font-size="12" fill="rgba(255,255,255,0.85)">https://openworldeye.app · Opens in default browser</text>

        <!-- Readiness Tag -->
        <rect x="760" y="24" width="94" height="26" rx="6" fill="rgba(0,0,0,0.25)"/>
        <circle cx="774" cy="37" r="4.5" fill="#ff7b00"/>
        <text x="786" y="41" class="sf-mono" font-size="11" font-weight="600" fill="#ffffff">LP · HOT</text>
      </g>

      <!-- Second Result (GitHub Repo) -->
      <g transform="translate(0, 84)">
        <rect width="872" height="66" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.04)"/>
        <rect x="16" y="13" width="40" height="40" rx="9" fill="rgba(255,255,255,0.06)"/>
        <text x="26" y="39" font-size="20">🐙</text>
        <text x="74" y="32" class="sf-display" font-size="15" font-weight="500" fill="#e2e8f0">OpenWorldEye — GitHub Repository</text>
        <text x="74" y="51" class="sf-mono" font-size="11" fill="#64748b">github.com/chama-x/openworldeye · Main branch</text>
        <text x="815" y="40" class="sf-mono" font-size="12" fill="#64748b">⌘2</text>
      </g>

      <!-- Third Result (Documentation Quick Look) -->
      <g transform="translate(0, 158)">
        <rect width="872" height="66" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.04)"/>
        <rect x="16" y="13" width="40" height="40" rx="9" fill="rgba(255,255,255,0.06)"/>
        <text x="26" y="39" font-size="20">📄</text>
        <text x="74" y="32" class="sf-display" font-size="15" font-weight="500" fill="#e2e8f0">OpenWorldEye — Documentation Sheet</text>
        <text x="74" y="51" class="sf-mono" font-size="11" fill="#64748b">README.html · Press Spacebar for Quick Look</text>
        <text x="815" y="40" class="sf-mono" font-size="12" fill="#64748b">⌘3</text>
      </g>

      <!-- Bottom Bar with Invariant Status -->
      <g transform="translate(0, 240)">
        <line x1="0" y1="0" x2="872" y2="0" stroke="rgba(255,255,255,0.08)"/>
        <text x="8" y="24" class="sf-text" font-size="12" fill="#64748b">Indexed via native macOS <tspan fill="#94a3b8" font-weight="600">.webloc</tspan> plists in <tspan class="sf-mono" fill="#38bdf8">Launchpad/</tspan></text>
        <text x="864" y="24" class="sf-mono" font-size="11" fill="#64748b" text-anchor="end">No resident processes</text>
      </g>
    </g>
  </g>
</svg>
