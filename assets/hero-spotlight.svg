<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="100%" height="100%">
  <defs>
    <!-- Frosted Glass Gradient -->
    <linearGradient id="spotlight-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e212b"/>
      <stop offset="100%" stop-color="#14161f"/>
    </linearGradient>

    <linearGradient id="search-input-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.03)"/>
    </linearGradient>

    <linearGradient id="selected-row-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- macOS Window Drop Shadow -->
    <filter id="window-shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.30"/>
    </filter>

    <style>
      .sf-display { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro", "Helvetica Neue", sans-serif; }
      .sf-text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", "Helvetica Neue", sans-serif; }
      .sf-mono { font-family: "SF Mono", Menlo, Monaco, monospace; }
    </style>
  </defs>

  <!-- Ambient Backdrop Glow (Subtle & Centered) -->
  <circle cx="480" cy="245" r="360" fill="#2563eb" opacity="0.08"/>
  <circle cx="300" cy="180" r="280" fill="#ff7b00" opacity="0.05"/>

  <!-- Centered macOS Spotlight Window -->
  <g transform="translate(40, 25)" filter="url(#window-shadow)">
    <!-- Window Body -->
    <rect width="880" height="440" rx="18" fill="url(#spotlight-body)" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>

    <!-- Search Input Bar -->
    <g transform="translate(20, 20)">
      <rect width="840" height="60" rx="12" fill="url(#search-input-bg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      
      <!-- Magnifying Glass Icon -->
      <g transform="translate(18, 18)">
        <circle cx="10" cy="10" r="7.5" fill="none" stroke="#94a3b8" stroke-width="2"/>
        <line x1="15.5" y1="15.5" x2="22" y2="22" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      </g>

      <!-- Search Input Text -->
      <text x="54" y="37" class="sf-display" font-size="20" font-weight="500" fill="#ffffff" letter-spacing="-0.2">openworldeye live</text>
      <line x1="234" y1="18" x2="234" y2="42" stroke="#38bdf8" stroke-width="2"/>

      <!-- Return Key Badge -->
      <rect x="750" y="16" width="74" height="28" rx="6" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)"/>
      <text x="787" y="35" class="sf-text" font-size="12" font-weight="600" fill="#cbd5e1" text-anchor="middle">Return ↵</text>
    </g>

    <!-- Search Results Rows -->
    <g transform="translate(20, 96)">
      <!-- Selected Top Result -->
      <g transform="translate(0, 0)">
        <rect width="840" height="74" rx="10" fill="url(#selected-row-bg)"/>
        
        <rect x="16" y="15" width="44" height="44" rx="9" fill="rgba(255,255,255,0.2)"/>
        <text x="27" y="44" font-size="22">🌐</text>

        <text x="72" y="34" class="sf-display" font-size="16" font-weight="600" fill="#ffffff">OpenWorldEye — Live Deployment</text>
        <text x="72" y="55" class="sf-mono" font-size="12" fill="rgba(255,255,255,0.85)">https://openworldeye.app · Opens in default browser</text>

        <rect x="732" y="24" width="92" height="26" rx="6" fill="rgba(0,0,0,0.25)"/>
        <circle cx="746" cy="37" r="4.5" fill="#ff7b00"/>
        <text x="758" y="41" class="sf-mono" font-size="11" font-weight="600" fill="#ffffff">LP · HOT</text>
      </g>

      <!-- Second Result (GitHub Repo) -->
      <g transform="translate(0, 84)">
        <rect width="840" height="66" rx="9" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.04)"/>
        <rect x="16" y="13" width="40" height="40" rx="8" fill="rgba(255,255,255,0.06)"/>
        <text x="26" y="39" font-size="20">🐙</text>
        <text x="72" y="32" class="sf-display" font-size="15" font-weight="500" fill="#e2e8f0">OpenWorldEye — GitHub Repository</text>
        <text x="72" y="51" class="sf-mono" font-size="11" fill="#64748b">github.com/chama-x/openworldeye · Main branch</text>
        <text x="790" y="40" class="sf-mono" font-size="12" fill="#64748b">⌘2</text>
      </g>

      <!-- Third Result (Documentation Quick Look) -->
      <g transform="translate(0, 158)">
        <rect width="840" height="66" rx="9" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.04)"/>
        <rect x="16" y="13" width="40" height="40" rx="8" fill="rgba(255,255,255,0.06)"/>
        <text x="26" y="39" font-size="20">📄</text>
        <text x="72" y="32" class="sf-display" font-size="15" font-weight="500" fill="#e2e8f0">OpenWorldEye — Quick Look Preview</text>
        <text x="72" y="51" class="sf-mono" font-size="11" fill="#64748b">README.html · Press Spacebar to preview</text>
        <text x="790" y="40" class="sf-mono" font-size="12" fill="#64748b">⌘3</text>
      </g>

      <!-- Bottom Status Bar -->
      <g transform="translate(0, 246)">
        <line x1="0" y1="0" x2="840" y2="0" stroke="rgba(255,255,255,0.08)"/>
        <text x="6" y="22" class="sf-text" font-size="12" fill="#64748b">Spotlight index in <tspan class="sf-mono" fill="#38bdf8">Launchpad/</tspan> · 0 MB Idle RAM</text>
        <text x="834" y="22" class="sf-mono" font-size="11" fill="#64748b" text-anchor="end">Pure Python 3 Stdlib</text>
      </g>
    </g>
  </g>
</svg>
