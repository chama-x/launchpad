<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <defs>
    <!-- Background Canvas -->
    <linearGradient id="life-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080c"/>
      <stop offset="50%" stop-color="#0b0e15"/>
      <stop offset="100%" stop-color="#10131d"/>
    </linearGradient>

    <!-- Tier Card Gradients -->
    <linearGradient id="cold-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(100, 116, 139, 0.16)"/>
      <stop offset="100%" stop-color="rgba(100, 116, 139, 0.03)"/>
    </linearGradient>
    <linearGradient id="warm-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(234, 179, 8, 0.16)"/>
      <stop offset="100%" stop-color="rgba(234, 179, 8, 0.03)"/>
    </linearGradient>
    <linearGradient id="hot-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 123, 0, 0.18)"/>
      <stop offset="100%" stop-color="rgba(255, 123, 0, 0.03)"/>
    </linearGradient>
    <linearGradient id="pinned-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(168, 85, 247, 0.16)"/>
      <stop offset="100%" stop-color="rgba(168, 85, 247, 0.03)"/>
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.60"/>
    </filter>

    <style>
      .txt-display { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
      .txt-body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
      .txt-mono { font-family: "SF Mono", Menlo, Monaco, monospace; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="620" fill="url(#life-bg)" rx="16"/>

  <!-- Title & Premise -->
  <g transform="translate(60, 44)">
    <text x="0" y="24" class="txt-display" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="-0.3">Project Storage Lifecycle</text>
    <text x="0" y="46" class="txt-body" font-size="13" fill="#94a3b8">"Fat when working, lean when resting" · Automatic disk reclamation · Instant hydration</text>
  </g>

  <!-- 3 Primary Tiers Container -->
  <g transform="translate(60, 110)">
    
    <!-- 1. COLD TIER -->
    <g transform="translate(0, 0)" filter="url(#card-shadow)">
      <rect width="330" height="340" rx="14" fill="url(#cold-card)" stroke="#64748b" stroke-opacity="0.35" stroke-width="1.2"/>
      
      <!-- Header -->
      <circle cx="36" cy="36" r="14" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <text x="30" y="41" font-size="14">☁️</text>
      <text x="62" y="34" class="txt-display" font-size="18" font-weight="700" fill="#94a3b8">COLD</text>
      <text x="62" y="50" class="txt-body" font-size="11" fill="#64748b">Remote Cloud Anchor</text>

      <line x1="20" y1="68" x2="310" y2="68" stroke="rgba(255,255,255,0.06)"/>

      <!-- Specs -->
      <g transform="translate(20, 88)">
        <text x="0" y="16" class="txt-mono" font-size="11" fill="#e2e8f0">• Disk size: <tspan font-weight="700" fill="#22c55e">0 KB on disk</tspan></text>
        <text x="0" y="42" class="txt-mono" font-size="11" fill="#e2e8f0">• Local tree: <tspan fill="#94a3b8">Not cloned</tspan></text>
        <text x="0" y="68" class="txt-mono" font-size="11" fill="#e2e8f0">• Spotlight: <tspan fill="#60a5fa">Indexed .webloc</tspan></text>
        <text x="0" y="94" class="txt-mono" font-size="11" fill="#e2e8f0">• Finder Tag: <tspan fill="#94a3b8">⚪️ Gray Dot</tspan></text>
      </g>

      <!-- Bottom Status Pill -->
      <rect x="20" y="276" width="290" height="42" rx="8" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.05)"/>
      <text x="32" y="302" class="txt-body" font-size="11" fill="#94a3b8">Hydrates in &lt; 5s via git clone</text>
    </g>

    <!-- Transition Arrow: COLD <-> WARM -->
    <g transform="translate(342, 140)">
      <line x1="0" y1="0" x2="28" y2="0" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="14" y="-8" class="txt-mono" font-size="9" fill="#64748b" text-anchor="middle">120d</text>
    </g>

    <!-- 2. WARM TIER -->
    <g transform="translate(376, 0)" filter="url(#card-shadow)">
      <rect width="330" height="340" rx="14" fill="url(#warm-card)" stroke="#eab308" stroke-opacity="0.35" stroke-width="1.2"/>
      
      <circle cx="36" cy="36" r="14" fill="#2d260f" stroke="#eab308" stroke-width="1"/>
      <text x="30" y="41" font-size="14">⚡</text>
      <text x="62" y="34" class="txt-display" font-size="18" font-weight="700" fill="#eab308">WARM</text>
      <text x="62" y="50" class="txt-body" font-size="11" fill="#ca8a04">Lean Working Tree</text>

      <line x1="20" y1="68" x2="310" y2="68" stroke="rgba(255,255,255,0.06)"/>

      <g transform="translate(20, 88)">
        <text x="0" y="16" class="txt-mono" font-size="11" fill="#e2e8f0">• Disk size: <tspan font-weight="700" fill="#eab308">~1–15 MB</tspan></text>
        <text x="0" y="42" class="txt-mono" font-size="11" fill="#e2e8f0">• Local tree: <tspan fill="#e2e8f0">Clean git clone</tspan></text>
        <text x="0" y="68" class="txt-mono" font-size="11" fill="#e2e8f0">• Dependencies: <tspan fill="#94a3b8">Purged</tspan></text>
        <text x="0" y="94" class="txt-mono" font-size="11" fill="#e2e8f0">• Finder Tag: <tspan fill="#eab308">🟡 Yellow Dot</tspan></text>
      </g>

      <rect x="20" y="276" width="290" height="42" rx="8" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.05)"/>
      <text x="32" y="302" class="txt-body" font-size="11" fill="#eab308">Ready for instant git branch work</text>
    </g>

    <!-- Transition Arrow: WARM <-> HOT -->
    <g transform="translate(718, 140)">
      <line x1="0" y1="0" x2="28" y2="0" stroke="#ff7b00" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="14" y="-8" class="txt-mono" font-size="9" fill="#ff7b00" text-anchor="middle">21d</text>
    </g>

    <!-- 3. HOT TIER -->
    <g transform="translate(752, 0)" filter="url(#card-shadow)">
      <rect width="330" height="340" rx="14" fill="url(#hot-card)" stroke="#ff7b00" stroke-opacity="0.45" stroke-width="1.2"/>
      
      <circle cx="36" cy="36" r="14" fill="#381b0a" stroke="#ff7b00" stroke-width="1"/>
      <text x="30" y="41" font-size="14">🔥</text>
      <text x="62" y="34" class="txt-display" font-size="18" font-weight="700" fill="#ff7b00">HOT</text>
      <text x="62" y="50" class="txt-body" font-size="11" fill="#ea580c">Active Execution</text>

      <line x1="20" y1="68" x2="310" y2="68" stroke="rgba(255,255,255,0.06)"/>

      <g transform="translate(20, 88)">
        <text x="0" y="16" class="txt-mono" font-size="11" fill="#e2e8f0">• Disk size: <tspan font-weight="700" fill="#ff7b00">Full (200MB–2GB)</tspan></text>
        <text x="0" y="42" class="txt-mono" font-size="11" fill="#e2e8f0">• Dependencies: <tspan fill="#22c55e">node_modules / .venv</tspan></text>
        <text x="0" y="68" class="txt-mono" font-size="11" fill="#e2e8f0">• Execution: <tspan fill="#38bdf8">Ready (`launchpad run`)</tspan></text>
        <text x="0" y="94" class="txt-mono" font-size="11" fill="#e2e8f0">• Finder Tag: <tspan fill="#ff7b00">🟠 Orange Dot</tspan></text>
      </g>

      <rect x="20" y="276" width="290" height="42" rx="8" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.05)"/>
      <text x="32" y="302" class="txt-body" font-size="11" fill="#ff7b00">Auto-allocated collision-free port</text>
    </g>
  </g>

  <!-- Bottom Bar: Safety & Pinned Exemption -->
  <g transform="translate(60, 480)">
    <rect width="1082" height="90" rx="12" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    
    <!-- Pinned Badge -->
    <g transform="translate(24, 22)">
      <rect width="100" height="24" rx="6" fill="rgba(168,85,247,0.15)" stroke="rgba(168,85,247,0.3)"/>
      <circle cx="14" cy="12" r="4" fill="#a855f7"/>
      <text x="26" y="16" class="txt-mono" font-size="10" font-weight="700" fill="#c084fc">🟣 PINNED</text>
      <text x="114" y="17" class="txt-body" font-size="12" fill="#cbd5e1">Projects marked with <tspan class="txt-mono" fill="#ffffff">launchpad pin &lt;id&gt;</tspan> are permanently exempt from automated decay.</text>
    </g>

    <!-- Safety Audit Invariant -->
    <g transform="translate(24, 54)">
      <text x="0" y="16" class="txt-mono" font-size="11" fill="#22c55e">✓ Zero Data Loss Invariant:</text>
      <text x="180" y="16" class="txt-body" font-size="12" fill="#94a3b8">Demotion halts if uncommitted edits, stashes, or unpushed branch commits exist.</text>
    </g>
  </g>
</svg>
