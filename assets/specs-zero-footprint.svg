<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 110" width="100%" height="100%">
  <defs>
    <linearGradient id="spec-card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16181f"/>
      <stop offset="100%" stop-color="#0f1117"/>
    </linearGradient>

    <linearGradient id="spec-card-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)"/>
    </linearGradient>

    <style>
      .sf-num { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro", "Helvetica Neue", sans-serif; font-weight: 700; font-size: 28px; fill: #ffffff; letter-spacing: -0.5px; }
      .sf-title { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", "Helvetica Neue", sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
      .sf-desc { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", "Helvetica Neue", sans-serif; font-weight: 400; font-size: 11.5px; fill: #64748b; }
      .sf-label { font-family: "SF Mono", Menlo, Monaco, monospace; font-weight: 600; font-size: 10px; letter-spacing: 0.6px; }
    </style>
  </defs>

  <!-- Card 1: Zero Resident Memory -->
  <g transform="translate(10, 8)">
    <rect width="300" height="94" rx="12" fill="url(#spec-card-bg)" stroke="url(#spec-card-stroke)" stroke-width="1"/>
    <circle cx="24" cy="24" r="4.5" fill="#10b981"/>
    <text x="36" y="27.5" class="sf-label" fill="#10b981">MEMORY FOOTPRINT</text>
    
    <text x="24" y="62" class="sf-num">0 MB</text>
    <text x="96" y="60" class="sf-title">Idle RAM</text>
    <text x="24" y="82" class="sf-desc">Consumes 0 bytes when not running a command</text>
  </g>

  <!-- Card 2: Zero Background Daemons -->
  <g transform="translate(330, 8)">
    <rect width="300" height="94" rx="12" fill="url(#spec-card-bg)" stroke="url(#spec-card-stroke)" stroke-width="1"/>
    <circle cx="24" cy="24" r="4.5" fill="#0ea5e9"/>
    <text x="36" y="27.5" class="sf-label" fill="#0ea5e9">BACKGROUND PROCESSES</text>
    
    <text x="24" y="62" class="sf-num">0</text>
    <text x="48" y="60" class="sf-title">Resident Daemons</text>
    <text x="24" y="82" class="sf-desc">Executes in ~40ms and immediately terminates</text>
  </g>

  <!-- Card 3: Pure Standard Library -->
  <g transform="translate(650, 8)">
    <rect width="300" height="94" rx="12" fill="url(#spec-card-bg)" stroke="url(#spec-card-stroke)" stroke-width="1"/>
    <circle cx="24" cy="24" r="4.5" fill="#a855f7"/>
    <text x="36" y="27.5" class="sf-label" fill="#a855f7">DEPENDENCY GRAPH</text>
    
    <text x="24" y="62" class="sf-num">0</text>
    <text x="48" y="60" class="sf-title">Pip Packages</text>
    <text x="24" y="82" class="sf-desc">100% Python 3 standard library only</text>
  </g>
</svg>
