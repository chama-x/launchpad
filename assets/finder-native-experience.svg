<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="finder-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080c"/>
      <stop offset="50%" stop-color="#0b0e15"/>
      <stop offset="100%" stop-color="#10131d"/>
    </linearGradient>

    <linearGradient id="window-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1f2b"/>
      <stop offset="100%" stop-color="#141620"/>
    </linearGradient>

    <linearGradient id="sidebar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(16, 18, 26, 0.96)"/>
      <stop offset="100%" stop-color="rgba(12, 14, 20, 0.96)"/>
    </linearGradient>

    <linearGradient id="menu-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242838"/>
      <stop offset="100%" stop-color="#1a1c28"/>
    </linearGradient>

    <filter id="window-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.80"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.40"/>
    </filter>

    <filter id="menu-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.50"/>
    </filter>

    <style>
      .sf-title { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; font-size: 13px; font-weight: 600; fill: #ffffff; }
      .sf-body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; font-size: 12px; fill: #e2e8f0; }
      .sf-meta { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; font-size: 11px; fill: #94a3b8; }
      .sf-sidebar { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; font-size: 12px; font-weight: 500; fill: #cbd5e1; }
      .sf-mono { font-family: "SF Mono", Menlo, Monaco, monospace; font-size: 11px; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="680" fill="url(#finder-bg)"/>

  <!-- Title / Header -->
  <g transform="translate(60, 40)">
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display'" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="-0.3">Native macOS Finder Integration</text>
    <text x="0" y="44" class="sf-meta" font-size="13">Native Tag Dots • Quick Actions • Spacebar Quick Look • Zero Custom Windows</text>
  </g>

  <!-- Main Finder Window -->
  <g transform="translate(60, 95)">
    <!-- Window Frame -->
    <rect width="1080" height="520" rx="14" fill="url(#window-body)" stroke="rgba(255,255,255,0.14)" stroke-width="1" filter="url(#window-shadow)"/>

    <!-- Window Titlebar -->
    <g transform="translate(0, 0)">
      <path d="M0 14 Q0 0 14 0 L1066 0 Q1080 0 1080 14 L1080 44 L0 44 Z" fill="#181b26"/>
      <line x1="0" y1="44" x2="1080" y2="44" stroke="rgba(255,255,255,0.08)"/>

      <!-- Traffic Lights -->
      <g transform="translate(18, 16)">
        <circle cx="6" cy="6" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
        <circle cx="26" cy="6" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
        <circle cx="46" cy="6" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>
      </g>

      <!-- Window Title -->
      <text x="540" y="27" text-anchor="middle" class="sf-title">Projects — ~/Projects</text>
    </g>

    <!-- Sidebar Section -->
    <g transform="translate(0, 44)">
      <path d="M0 0 L210 0 L210 476 L14 476 Q0 476 0 462 Z" fill="url(#sidebar-grad)"/>
      <line x1="210" y1="0" x2="210" y2="476" stroke="rgba(255,255,255,0.08)"/>

      <!-- Sidebar Items -->
      <g transform="translate(16, 20)">
        <text x="8" y="10" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="0.6">FAVORITES</text>

        <g transform="translate(0, 22)">
          <text x="26" y="16" class="sf-sidebar">Applications</text>
          <text x="6" y="16">🚀</text>
        </g>
        <g transform="translate(0, 52)">
          <text x="26" y="16" class="sf-sidebar">Desktop</text>
          <text x="6" y="16">🖥️</text>
        </g>
        <g transform="translate(0, 82)">
          <rect x="-6" y="0" width="194" height="28" rx="6" fill="#2563eb" fill-opacity="0.35"/>
          <text x="26" y="18" class="sf-sidebar" font-weight="600" fill="#ffffff">Projects</text>
          <text x="6" y="18">📁</text>
        </g>
        <g transform="translate(0, 114)">
          <text x="26" y="16" class="sf-sidebar">Launchpad</text>
          <text x="6" y="16">⚡</text>
        </g>

        <!-- TAGS Section in Sidebar -->
        <g transform="translate(0, 170)">
          <text x="8" y="10" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="0.6">READINESS TAGS</text>
          <g transform="translate(0, 22)">
            <circle cx="10" cy="12" r="5" fill="#ff7b00"/>
            <text x="26" y="16" class="sf-sidebar">LP · HOT</text>
          </g>
          <g transform="translate(0, 48)">
            <circle cx="10" cy="12" r="5" fill="#eab308"/>
            <text x="26" y="16" class="sf-sidebar">LP · WARM</text>
          </g>
          <g transform="translate(0, 74)">
            <circle cx="10" cy="12" r="5" fill="#94a3b8"/>
            <text x="26" y="16" class="sf-sidebar">LP · COLD</text>
          </g>
          <g transform="translate(0, 100)">
            <circle cx="10" cy="12" r="5" fill="#a855f7"/>
            <text x="26" y="16" class="sf-sidebar">LP · Pinned</text>
          </g>
        </g>
      </g>
    </g>

    <!-- Main List View Section -->
    <g transform="translate(210, 44)">
      <!-- List Column Header -->
      <rect width="870" height="28" fill="rgba(255,255,255,0.02)"/>
      <line x1="0" y1="28" x2="870" y2="28" stroke="rgba(255,255,255,0.06)"/>

      <text x="36" y="18" class="sf-meta" font-weight="600">Name</text>
      <text x="260" y="18" class="sf-meta" font-weight="600">Tag / Status</text>
      <text x="420" y="18" class="sf-meta" font-weight="600">Disk Size</text>
      <text x="560" y="18" class="sf-meta" font-weight="600">Kind</text>
      <text x="720" y="18" class="sf-meta" font-weight="600">Last Active</text>

      <!-- Row 1: Selected HOT Project -->
      <g transform="translate(0, 28)">
        <rect width="870" height="38" fill="#2563eb" fill-opacity="0.25"/>
        <text x="14" y="24" font-size="14">📁</text>
        <text x="36" y="24" class="sf-body" font-weight="600" fill="#ffffff">openworldeye</text>
        
        <circle cx="266" cy="20" r="5" fill="#ff7b00"/>
        <text x="280" y="24" class="sf-mono" fill="#ff7b00">LP · HOT</text>
        
        <text x="420" y="24" class="sf-mono" fill="#ffffff">842.1 MB</text>
        <text x="560" y="24" class="sf-body" fill="#cbd5e1">Next.js App</text>
        <text x="720" y="24" class="sf-meta">Today, 2:14 PM</text>
      </g>

      <!-- Row 2: WARM Project -->
      <g transform="translate(0, 66)">
        <text x="14" y="24" font-size="14">📁</text>
        <text x="36" y="24" class="sf-body" fill="#e2e8f0">neural-canvas</text>
        
        <circle cx="266" cy="20" r="5" fill="#eab308"/>
        <text x="280" y="24" class="sf-mono" fill="#eab308">LP · WARM</text>
        
        <text x="420" y="24" class="sf-mono" fill="#cbd5e1">8.4 MB</text>
        <text x="560" y="24" class="sf-body" fill="#94a3b8">Python / PyTorch</text>
        <text x="720" y="24" class="sf-meta">14 days ago</text>
      </g>

      <!-- Row 3: COLD Project -->
      <g transform="translate(0, 104)">
        <text x="14" y="24" font-size="14" opacity="0.6">☁️</text>
        <text x="36" y="24" class="sf-body" fill="#94a3b8">crypto-ledger</text>
        
        <circle cx="266" cy="20" r="5" fill="#64748b"/>
        <text x="280" y="24" class="sf-mono" fill="#64748b">LP · COLD</text>
        
        <text x="420" y="24" class="sf-mono" fill="#22c55e">0 KB on disk</text>
        <text x="560" y="24" class="sf-body" fill="#64748b">Go Service</text>
        <text x="720" y="24" class="sf-meta">64 days ago</text>
      </g>

      <!-- Row 4: Pinned Project -->
      <g transform="translate(0, 142)">
        <text x="14" y="24" font-size="14">📌</text>
        <text x="36" y="24" class="sf-body" fill="#e2e8f0">mission-control</text>
        
        <circle cx="266" cy="20" r="5" fill="#a855f7"/>
        <text x="280" y="24" class="sf-mono" fill="#c084fc">LP · Pinned</text>
        
        <text x="420" y="24" class="sf-mono" fill="#cbd5e1">1.2 GB</text>
        <text x="560" y="24" class="sf-body" fill="#94a3b8">Rust Monorepo</text>
        <text x="720" y="24" class="sf-meta">Decay Exempt</text>
      </g>
    </g>

    <!-- Context Menu Overlay (Simulating Right-Click) -->
    <g transform="translate(420, 150)" filter="url(#menu-shadow)">
      <rect width="250" height="230" rx="10" fill="url(#menu-grad)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>

      <g transform="translate(10, 14)">
        <text x="12" y="16" class="sf-body">Open in Editor</text>
        <text x="200" y="16" class="sf-meta">⌘O</text>

        <text x="12" y="44" class="sf-body">Quick Look "README.html"</text>
        <text x="200" y="44" class="sf-meta">Space</text>

        <line x1="6" y1="62" x2="224" y2="62" stroke="rgba(255,255,255,0.10)"/>

        <!-- Quick Actions Submenu Item -->
        <g transform="translate(0, 72)">
          <rect x="0" y="0" width="230" height="28" rx="6" fill="#2563eb"/>
          <text x="12" y="18" class="sf-body" font-weight="600" fill="#ffffff">Quick Actions</text>
          <text x="205" y="18" class="sf-body" fill="#ffffff">▶</text>
        </g>

        <!-- Flyout Quick Actions Menu -->
        <g transform="translate(236, 68)" filter="url(#menu-shadow)">
          <rect width="200" height="110" rx="8" fill="url(#menu-grad)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
          <g transform="translate(12, 14)">
            <text x="6" y="16" class="sf-body">⚡ Hydrate (Install)</text>
            <text x="6" y="44" class="sf-body">🚀 Run Server (Port)</text>
            <line x1="0" y1="58" x2="176" y2="58" stroke="rgba(255,255,255,0.1)"/>
            <text x="6" y="78" class="sf-body" fill="#f87171">🧹 Evict Dependencies</text>
          </g>
        </g>

        <g transform="translate(0, 110)">
          <text x="12" y="16" class="sf-body">Set Live URL...</text>
          <text x="12" y="44" class="sf-body">Copy Project JSON Card</text>
        </g>
      </g>
    </g>
  </g>
</svg>
